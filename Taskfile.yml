version: '3'

vars:
  BUCKET:
    sh: cd infra && terraform output -raw s3_bucket_name 2>/dev/null || echo ""
  DISTRIBUTION_ID:
    sh: cd infra && terraform output -raw cloudfront_distribution_id 2>/dev/null ||
      echo ""

tasks:
  check:
    desc: "THE local gate: API + web + infra checks, then every pre-commit hook on all files (same commands as CI)"
    cmds:
      - task: check:api
      - task: check:web
      - task: check:infra
      # prek is a drop-in pre-commit runner; fall back to uvx when it isn't installed.
      - |
        if command -v prek >/dev/null 2>&1; then
          prek run --all-files
        else
          uvx prek run --all-files
        fi

  check:api:
    desc: "API: ruff lint + format check, ty, pytest with the coverage floor (same commands as CI's API tests / Lint jobs)"
    dir: api
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - uv run --locked ty check
      - uv run --locked pytest tests/ -q --cov --cov-report=term

  check:web:
    desc: "Web: typecheck, oxlint, oxfmt check, vitest with coverage (same commands as CI's web jobs)"
    dir: web
    cmds:
      - npm run typecheck
      - npx oxlint src/
      - npx oxfmt --check src/
      - npm run test:coverage

  check:infra:
    desc: "Infra: terraform fmt check + validate (no backend, no AWS credentials needed)"
    dir: infra
    cmds:
      - terraform fmt -check -recursive
      - terraform init -backend=false -input=false > /dev/null
      - terraform validate

  init:
    desc: "Initialize Terraform (S3 state; infra/backend.hcl overrides the bucket if present) and install npm dependencies"
    cmds:
      - cd infra && terraform init $([ -f backend.hcl ] && echo -backend-config=backend.hcl)
      - cd web && npm ci

  state:bootstrap:
    desc: "Create the Terraform state bucket from infra/backend.tf (or backend.hcl override); idempotent, once per AWS account"
    dir: infra
    cmds:
      - |
        set -e
        # backend.hcl (optional, gitignored) overrides backend.tf — same `key = "value"` syntax.
        BUCKET=$(awk -F'"' '/^ *bucket *=/ {v=$2} END {print v}' backend.tf $([ -f backend.hcl ] && echo backend.hcl))
        REGION=$(awk -F'"' '/^ *region *=/ {v=$2} END {print v}' backend.tf $([ -f backend.hcl ] && echo backend.hcl))
        echo "state bucket: $BUCKET ($REGION)"
        if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
          echo "state bucket $BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
            --create-bucket-configuration LocationConstraint="$REGION"
          echo "created $BUCKET"
        fi
        aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
        aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration \
          '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
        aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
          BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

  state:migrate:
    desc: "One-time move of local terraform.tfstate (all workspaces) into the S3 backend"
    dir: infra
    cmds:
      - terraform init -migrate-state -force-copy $([ -f backend.hcl ] && echo -backend-config=backend.hcl)

  build-api:
    desc: "Build API lambda.zip (skipped if api/ source unchanged)"
    cmds:
      - |
        CURRENT_HASH=$(find api/ -type f \
          ! -path 'api/dist/*' \
          ! -path 'api/.venv/*' \
          ! -path 'api/.pytest_cache/*' \
          ! -name 'lambda.zip' \
          ! -name '*.pyc' \
          ! -path '*/__pycache__/*' \
          | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
        STORED_HASH=$(cat .api-build-hash 2>/dev/null || echo "")
        # Hash match alone isn't enough: the zip may have been deleted since.
        if [ "$CURRENT_HASH" = "$STORED_HASH" ] && [ -f api/lambda.zip ]; then
          echo "API source unchanged — skipping Lambda build"
          exit 0
        fi
        bash api/build.sh
        echo "$CURRENT_HASH" > .api-build-hash

  build-frontend:
    desc: "Build web frontend (Vite)"
    cmds:
      - cd web && npm run build

  build:
    desc: "Build API (smart, skips if unchanged) and web (Vite)"
    cmds:
      - task: build-api
      - task: build-frontend

  test:
    desc: "Run API tests (runs automatically before deploy)"
    cmds:
      - cd api && uv run pytest tests/ -v

  plan:
    desc: "Terraform plan (prod / default workspace)"
    dir: infra
    cmds:
      - terraform workspace select default
      - terraform plan

  apply:
    desc: "Terraform apply (prod / default workspace)"
    dir: infra
    # Prod only ships what's on origin/main: on main, clean tree, up to date.
    # No escape hatch on purpose.
    preconditions: &prod_preconditions
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = main ]'
        msg: "Prod deploys only from the main branch (git switch main)"
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "Working tree is not clean: commit or stash changes (git status) before deploying"
      - sh: 'git fetch -q origin main && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]'
        msg: "HEAD is not origin/main: pull or push first so prod matches main"
    cmds:
      - terraform workspace select default
      - terraform apply

  plan:dev:
    desc: "Terraform plan (dev workspace)"
    dir: infra
    cmds:
      - terraform workspace select dev
      - defer: terraform workspace select default
      - terraform plan

  apply:dev:
    desc: "Terraform apply (dev workspace; DEPLOY_ALLOW_DIRTY=1 skips the main/clean/up-to-date checks)"
    dir: infra
    preconditions: &dev_preconditions
      - sh: '[ "${DEPLOY_ALLOW_DIRTY:-}" = 1 ] || [ "$(git rev-parse --abbrev-ref HEAD)" = main ]'
        msg: "Not on main. Switch to main, or set DEPLOY_ALLOW_DIRTY=1 to deploy this branch to dev"
      - sh: '[ "${DEPLOY_ALLOW_DIRTY:-}" = 1 ] || [ -z "$(git status --porcelain)" ]'
        msg: "Working tree is not clean. Commit/stash, or set DEPLOY_ALLOW_DIRTY=1 to deploy it to dev anyway"
      - sh: '[ "${DEPLOY_ALLOW_DIRTY:-}" = 1 ] || { git fetch -q origin main && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; }'
        msg: "HEAD is not origin/main. Pull/push, or set DEPLOY_ALLOW_DIRTY=1 to deploy it to dev anyway"
    cmds:
      - terraform workspace select dev
      - defer: terraform workspace select default
      - terraform apply

  deploy:
    desc: "Build, apply Terraform, sync web assets to S3, invalidate CloudFront,
      print URL"
    preconditions: *prod_preconditions
    cmds:
      - task: test
      - task: build
      - task: apply
      - |
        BUCKET=$(cd infra && terraform output -raw s3_bucket_name)
        DISTRIBUTION_ID=$(cd infra && terraform output -raw cloudfront_distribution_id)
        # The bucket also holds user uploads (avatars/, blog-images/, game-images/) and
        # table dumps (exports/), so a bucket-wide `--delete` is never safe: it deleted
        # game-images/ until 2026-09 because that prefix was missing from the excludes.
        # Only assets/ (content-hashed Vite output) is fully owned by the build and gets
        # pruned; the handful of root files (index.html, manifest, icons) are overwritten
        # in place and never deleted.
        aws s3 sync web/dist/assets/ s3://$BUCKET/assets/ --delete
        aws s3 sync web/dist/ s3://$BUCKET/ --exclude "assets/*"
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
        echo "Deployed to: https://$(cd infra && terraform output -raw cloudfront_url)"

  deploy:dev:
    desc: "Build, apply Terraform (dev workspace), sync web assets, invalidate CloudFront (DEPLOY_ALLOW_DIRTY=1 skips the main/clean/up-to-date checks)"
    preconditions: *dev_preconditions
    cmds:
      - task: test
      - task: build
      - |
        cd infra && terraform workspace select dev
        terraform apply
        BUCKET=$(terraform output -raw s3_bucket_name)
        DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
        URL=$(terraform output -raw cloudfront_url)
        terraform workspace select default
        cd ..
        # The bucket also holds user uploads (avatars/, blog-images/, game-images/) and
        # table dumps (exports/), so a bucket-wide `--delete` is never safe: it deleted
        # game-images/ until 2026-09 because that prefix was missing from the excludes.
        # Only assets/ (content-hashed Vite output) is fully owned by the build and gets
        # pruned; the handful of root files (index.html, manifest, icons) are overwritten
        # in place and never deleted.
        aws s3 sync web/dist/assets/ s3://$BUCKET/assets/ --delete
        aws s3 sync web/dist/ s3://$BUCKET/ --exclude "assets/*"
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
        echo "Deployed dev to: https://$URL"

  destroy:
    desc: "Terraform destroy (auto-approve)"
    cmds:
      - cd infra && terraform destroy

  users:
    desc: "List all users: task users -- [--env dev]"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/list-users.py {{.CLI_ARGS}}

  users:dev:
    desc: "List all users (dev table) — shortcut for: task users -- --env dev"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/list-users.py --env dev

  create-user:
    desc: "Create a user: task create-user -- --username alice --display-name
      'Alice' --role readonly --password secret [--env dev]"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/create-user.py {{.CLI_ARGS}}

  delete-user:
    desc: "Delete a user: task delete-user -- --username alice [--env dev]"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/delete-user.py {{.CLI_ARGS}}

  update-user:
    desc: "Update a user: task update-user -- --username alice --password newsecret [--env dev]"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/update-user.py {{.CLI_ARGS}}

  revoke-sessions:
    desc: "Kill all active sessions for a user: task revoke-sessions -- --username alice [--env dev]"
    cmds:
      - cd api && DB_BACKEND=dynamodb uv run python3 scripts/revoke-sessions.py {{.CLI_ARGS}}

  seed:
    desc: "Seed game catalog (requires --username and --password args)"
    cmds:
      - cd api && uv run python3 ../scripts/seed-games.py {{.CLI_ARGS}}
