[project]
name = "boardsite-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "mangum==0.21.0",
    "boto3==1.43.13",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "python-ulid==3.1.0",
    "pillow>=12.3.0",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "anyio==4.13.0",
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "slowapi==0.1.9",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = [
    "uvicorn==0.47.0",
    "pytest",
    "pytest-mock",
    "ruff>=0.15.17",
    "moto[dynamodb]>=5.2.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
