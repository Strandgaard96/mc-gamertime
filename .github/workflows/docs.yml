name: Docs

on:
  pull_request:
    paths:
      - "docs-site/**"
      - ".env.example"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      # The Release Notes page and the version badge are generated from these
      # at build time (docs-site/scripts/sync-release-info.mjs), so a release
      # commit that touches neither docs-site/ nor this file still has to
      # rebuild the site.
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      # configuration.mdx embeds this file with ?raw, so an edit to it
      # changes the published page and has to rebuild the site.
      - ".env.example"
      - ".github/workflows/docs.yml"

# Default token to read-only; the deploy job alone gets pages:write and
# id-token:write (for the deployment's OIDC attestation).
permissions:
  contents: read

# Never let two doc deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # lastUpdated needs full git history for per-page dates

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build (runs link validation)
        run: npm run build
        working-directory: docs-site

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build only; publishing happens on main. A broken link
    # fails the build above, so nothing unbuildable can reach the site.
    #
    # Also gated on the PAGES_ENABLED repository variable, because GitHub Pages
    # is unavailable on this plan while the repository is private and the
    # deploy step 404s. Turn publishing on with:
    #   Settings -> Pages -> Source: GitHub Actions
    #   gh variable set PAGES_ENABLED --body true
    if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
