name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token to read-only; jobs that need more (secrets-scan) declare it
# themselves. Superseded runs on the same branch/PR are cancelled so a rapid
# string of pushes doesn't queue up redundant full CI passes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Taskfile.yml is the source of truth for check commands: `task check` runs the
# same ruff / ty / pytest / tsc / oxlint / oxfmt / vitest / terraform commands
# the jobs below run (CI adds coverage flags). CI calls them directly rather
# than through `task` so each job stays one install + plain steps; when you
# change a command here, change it in the Taskfile's check:* tasks too.
jobs:
  # Path filter so a docs-only or README-only PR doesn't run the full matrix.
  # The jobs below stay defined on every run and are *skipped* rather than
  # missing, which still satisfies the required status checks on main (a
  # workflow-level `paths:` filter would leave them stuck at "Expected").
  # Editing this file re-runs everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      # Needed for push events (compares against the previous commit on main);
      # pull_request events use the API and don't need a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            api: &api
              - "api/**"
              - *ci
            web: &web
              - "web/**"
              - *ci
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "docker/**"
              - *api
              - *web
            infra:
              - "infra/**"
              - *ci
            workflows:
              - ".github/workflows/**"

  test:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      # --locked: fail if pyproject.toml changed without a re-lock. uv.lock is
      # what build.sh and the Dockerfile export from, so a stale one would ship
      # different dependencies than the ones tested here.
      - name: Install dependencies
        run: uv sync --locked
        working-directory: api

      - name: Run tests
        run: uv run --locked pytest tests/ -v --tb=short --cov --cov-report=term --cov-report=xml
        working-directory: api

      # Feeds the README coverage badge. Never fails the job: the floor is
      # enforced by `fail_under` above, not by Codecov being reachable.
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: api/coverage.xml
          disable_search: true
          flags: api
          fail_ci_if_error: false

      # Tests run in the uv venv, where every dependency exists. The Lambda zip
      # is a different artefact (exported from the `aws` group, Python 3.12,
      # manylinux wheels), and a dep missing from it is a cold-start
      # ImportModuleError on every route. Build it and import it the way
      # Lambda does.
      - name: Build Lambda bundle
        run: ./build.sh
        working-directory: api

      - name: Import Lambda bundle
        working-directory: api/dist
        env:
          DB_BACKEND: dynamodb
          STORAGE_BACKEND: s3
          SECRETS_PROVIDER: ssm
          AWS_DEFAULT_REGION: eu-west-1
        run: uv run --no-project --python 3.12 python -c "import main; import mangum"

  # PRs only: on push to main, publish.yml builds, scans and smoke-tests the
  # same image (same path list) before pushing it, so running it here too was
  # duplicate work. Required checks only gate PRs, so skipping on push is safe.
  docker-build:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Trivy SARIF upload to the Security tab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mc-gamertime:ci
          cache-from: type=gha
          # mode=min: only the final image's layers. mode=max also cached every
          # intermediate stage and filled most of the 10 GB Actions cache.
          cache-to: type=gha,mode=min

      # Non-blocking on PRs: a CVE published upstream yesterday shouldn't turn
      # an unrelated PR red. Findings land in the Security tab instead. The
      # gate is publish.yml (blocks before pushing any image) and the weekly
      # security-scan.yml.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mc-gamertime:ci
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      # Fork PRs get a read-only token, so the upload can fail there; that must
      # not fail the required check.
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The image built, but does it serve? The HEALTHCHECK probes
      # /api/health, which 503s if startup failed, so "healthy" means the app
      # initialised, migrated a fresh SQLite DB and bootstrapped an admin.
      - name: Smoke-test the container
        run: |
          docker run -d --name smoke \
            -e ADMIN_USERNAME=smoke -e ADMIN_PASSWORD=smoke-test-password \
            mc-gamertime:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' smoke
          docker logs smoke
          exit 1

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra

      # -backend=false: no AWS credentials or state access. validate checks
      # syntax, references and provider schemas only; it never plans.
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: infra

  typecheck:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

  web-test:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm run test:coverage
        working-directory: web

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.api == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        if: needs.changes.outputs.api == 'true'
        run: uv sync --locked
        working-directory: api

      - name: Ruff lint
        if: needs.changes.outputs.api == 'true'
        run: uv run --locked ruff check .
        working-directory: api

      - name: Ruff format check
        if: needs.changes.outputs.api == 'true'
        run: uv run --locked ruff format --check .
        working-directory: api

      - name: ty type check
        if: needs.changes.outputs.api == 'true'
        run: uv run --locked ty check
        working-directory: api

      # Audits the workflow files themselves (unpinned actions, template
      # injection, over-broad permissions). Only when they change.
      - name: zizmor
        if: needs.changes.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          advanced-security: false
          min-severity: medium

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
        working-directory: web

      - name: oxlint
        if: needs.changes.outputs.web == 'true'
        run: npx oxlint src/
        working-directory: web

      - name: oxfmt check
        if: needs.changes.outputs.web == 'true'
        run: npx oxfmt --check src/
        working-directory: web

      # hadolint and shellcheck run here rather than as pre-commit hooks (hooks
      # are the fast subset). Both take seconds, so they run on every PR.
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      # shellcheck is preinstalled on ubuntu runners.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
