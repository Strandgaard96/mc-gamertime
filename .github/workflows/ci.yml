name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token to read-only; jobs that need more (secrets-scan) declare it
# themselves. Superseded runs on the same branch/PR are cancelled so a rapid
# string of pushes doesn't queue up redundant full CI passes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter so a docs-only or README-only PR doesn't run the full matrix.
  # The jobs below stay defined on every run and are *skipped* rather than
  # missing, which still satisfies the required status checks on main (a
  # workflow-level `paths:` filter would leave them stuck at "Expected").
  # Editing this file re-runs everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      # Needed for push events (compares against the previous commit on main);
      # pull_request events use the API and don't need a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            api: &api
              - "api/**"
              - *ci
            web: &web
              - "web/**"
              - *ci
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "docker/**"
              - *api
              - *web
            workflows:
              - ".github/workflows/**"

  test:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: api

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term
        working-directory: api

  docker-build:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: mc-gamertime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mc-gamertime:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  typecheck:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

  web-test:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm run test
        working-directory: web

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.changes.outputs.api == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        if: needs.changes.outputs.api == 'true'
        run: uv sync
        working-directory: api

      - name: Ruff lint
        if: needs.changes.outputs.api == 'true'
        run: uv run ruff check .
        working-directory: api

      - name: Ruff format check
        if: needs.changes.outputs.api == 'true'
        run: uv run ruff format --check .
        working-directory: api

      - name: ty type check
        if: needs.changes.outputs.api == 'true'
        run: uv run ty check
        working-directory: api

      # Audits the workflow files themselves (unpinned actions, template
      # injection, over-broad permissions). Only when they change.
      - name: zizmor
        if: needs.changes.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          advanced-security: false
          min-severity: medium

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
        working-directory: web

      - name: oxlint
        if: needs.changes.outputs.web == 'true'
        run: npx oxlint src/
        working-directory: web

      - name: oxfmt check
        if: needs.changes.outputs.web == 'true'
        run: npx oxfmt --check src/
        working-directory: web

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
