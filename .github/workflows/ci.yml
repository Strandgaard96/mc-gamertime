name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default token to read-only; jobs that need more (secrets-scan) declare it
# themselves. Superseded runs on the same branch/PR are cancelled so a rapid
# string of pushes doesn't queue up redundant full CI passes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter so a docs-only or README-only PR doesn't run the full matrix.
  # The jobs below stay defined on every run and are *skipped* rather than
  # missing, which still satisfies the required status checks on main (a
  # workflow-level `paths:` filter would leave them stuck at "Expected").
  # Editing this file re-runs everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      # Needed for push events (compares against the previous commit on main);
      # pull_request events use the API and don't need a checkout.
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            api: &api
              - "api/**"
              - *ci
            web: &web
              - "web/**"
              - *ci
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "docker/**"
              - *api
              - *web

  test:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: api

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term
        working-directory: api

  docker-build:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mc-gamertime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mc-gamertime:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  typecheck:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

  web-test:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm run test
        working-directory: web

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        if: needs.changes.outputs.api == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        if: needs.changes.outputs.api == 'true'
        run: uv sync
        working-directory: api

      - name: Ruff lint
        if: needs.changes.outputs.api == 'true'
        run: uv run ruff check .
        working-directory: api

      - name: Ruff format check
        if: needs.changes.outputs.api == 'true'
        run: uv run ruff format --check .
        working-directory: api

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        if: needs.changes.outputs.web == 'true'
        run: npm ci
        working-directory: web

      - name: oxlint
        if: needs.changes.outputs.web == 'true'
        run: npx oxlint src/
        working-directory: web

      - name: oxfmt check
        if: needs.changes.outputs.web == 'true'
        run: npx oxfmt --check src/
        working-directory: web

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
