name: Security scan

# Weekly Trivy scan of what ships, independent of whether anything changed:
# new CVEs get published against dependencies we already have. Blocking (a red
# run is the signal) and uploaded to the Security tab.
#   - image: the Docker image built from main (OS packages + Python deps)
#   - fs:    the lockfiles (api/uv.lock, web/package-lock.json), which covers
#            the npm deps that only exist at build time. This replaces the old
#            trivy-fs pre-commit hook. docs-site/ is skipped: its deps never
#            ship in the app, so a docs-only devDep CVE shouldn't turn this red.
# PRs get a non-blocking image scan in ci.yml; publish.yml blocks before push.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Read the cache, never write it: a weekly build isn't worth cache space.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mc-gamertime:security-scan
          cache-from: type=gha

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mc-gamertime:security-scan
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      # Runs even when the image scan failed, so one red run reports both.
      - name: Scan lockfiles
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: docs-site
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload image results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload lockfile results
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
