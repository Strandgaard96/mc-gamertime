name: Publish Docker image

# Two ways in:
#   - push to main   → tags the image `main` (edge build, every commit)
#   - workflow_call  → from release-please.yml with the new release tag; tags
#                      the image `X.Y.Z`, `X.Y` and `latest`
#
# The `tags: ["v*"]` trigger this workflow used to have never fired: release-
# please creates its tags with GITHUB_TOKEN, and GitHub never starts a workflow
# for an event that token produced. Calling this workflow from the release job
# is the supported way around that.
on:
  push:
    branches: [main]
    # Only rebuild the `main` edge image when something that goes into it
    # changed. Release images are unaffected: release-please calls this via
    # workflow_call regardless of paths.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "api/**"
      - "web/**"
      - ".github/workflows/publish.yml"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.4)"
        required: true
        type: string

# Default token to read-only; the push job alone gets packages:write.
permissions:
  contents: read

jobs:
  push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Queue rather than cancel: a push already mid-flight to GHCR must finish
    # rather than be killed and leave a half-written tag. Job-level so it also
    # applies when this workflow is called from release-please.yml.
    concurrency:
      group: publish-${{ github.ref }}-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/strandgaard96/mc-gamertime
          # `inputs.tag` is empty on a plain push to main and set on a release.
          tags: |
            type=raw,value=main,enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}

      - name: Build (unpushed, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: mc-gamertime:publish-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mc-gamertime:publish-scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # BuildKit attestations, stored alongside the image on GHCR:
          # `docker buildx imagetools inspect <image> --format '{{json .Provenance}}'`
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
