name: OpenSSF Scorecard

# Weekly supply-chain hygiene score (https://scorecard.dev). `publish_results`
# is what feeds the README badge and the public viewer; it requires the job's
# `id-token: write` (OIDC proves the run belongs to this repository) and the
# default branch. No workflow-level write permissions, per zizmor.
# No `push` trigger: the score changes slowly, and a run on every merge to main
# was wasted minutes. `gh workflow run scorecard.yml` refreshes it on demand.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish_results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
