name: OpenSSF Scorecard

# Weekly supply-chain hygiene score (https://scorecard.dev). `publish_results`
# is what feeds the README badge and the public viewer; it requires the job's
# `id-token: write` (OIDC proves the run belongs to this repository) and the
# default branch. No workflow-level write permissions, per zizmor.
# No `push` trigger: the score changes slowly, and a run on every merge to main
# was wasted minutes. `gh workflow run scorecard.yml` refreshes it on demand.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish_results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
