name: OpenSSF Scorecard

# Weekly supply-chain hygiene score (https://scorecard.dev). `publish_results`
# is what feeds the README badge and the public viewer; it requires the job's
# `id-token: write` (OIDC proves the run belongs to this repository) and the
# default branch. No workflow-level write permissions, per zizmor.
on:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish_results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
