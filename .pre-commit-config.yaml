# Fast subset only: everything here runs in seconds on staged files.
# Slower or rarely-relevant checks live elsewhere: terraform validate in
# `task check:infra` + CI's Terraform job; hadolint/shellcheck in CI's Lint job
# only; Trivy in CI only (Docker build, publish, weekly security-scan.yml).
# `task check` runs these hooks plus terraform validate, not hadolint,
# shellcheck or Trivy.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
        exclude: ".*\\.vscode/.*"
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^api/"
      - id: ruff-format
        files: "^api/"

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        # Same bar as the CI step in ci.yml.
        args: ["--no-progress", "--min-severity=medium"]

  - repo: local
    hooks:
      - id: ty
        name: ty (Python type check)
        # Pinned through api/uv.lock, so hook and CI run the same version.
        entry: bash -c 'cd api && uv run ty check'
        language: system
        files: "^api/.*\\.py$"
        pass_filenames: false
      - id: oxlint
        name: oxlint
        # Severities live in web/.oxlintrc.json; no CLI overrides so hook == CI.
        entry: bash -c 'cd web && npx oxlint src/'
        language: system
        files: "^web/src/.*\\.(tsx?|jsx?|json)$"
        pass_filenames: false
      - id: oxfmt
        name: oxfmt
        entry: bash -c 'cd web && npx oxfmt src/'
        language: system
        files: "^web/src/.*\\.(tsx?|jsx?|json)$"
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
